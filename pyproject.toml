[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-edge-offloading"
version = "2.0.0"
description = "Mobility-aware vehicular edge-computing research framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "PyYAML>=6",
    "rich>=13.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
simulation = [
    "eclipse-sumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
]
deep-learning = [
    "torch>=2.2",
]
notebook = [
    "jupyter>=1.0",
]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pytest>=8",
    "ruff>=0.5",
    "types-PyYAML>=6",
]

[project.scripts]
edge-project = "edge_offloading.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["edge_offloading"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["edge_offloading.domain", "edge_offloading.data_reader"]
disable_error_code = ["arg-type", "no-any-return"]

[[tool.mypy.overrides]]
module = ["edge_offloading.evaluator", "edge_offloading.cli"]
disable_error_code = ["arg-type", "type-arg"]

[[tool.mypy.overrides]]
module = ["edge_offloading.models.implementations"]
disable_error_code = ["misc", "no-any-return", "type-arg"]
